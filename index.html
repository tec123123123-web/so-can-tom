<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sổ Cân Tôm</title>
<meta name="theme-color" content="#16181b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sổ Cân Tôm">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --navy:#16181b; --blue:#4b6878; --blue-soft:#e2e9ed; --ink:#0f172a; --mut:#64748b; --line:#e2e8f0;
  --bg:#eceff1; --card:#fff; --warn:#b45309; --warn-bg:#fff7e6; --red:#c62828; --red-bg:#fdecec; --ok:#0f7b3f; --ok-bg:#e7f6ee;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom); --sal:env(safe-area-inset-left); --sar:env(safe-area-inset-right);
  --fs:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:var(--fs)/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;overscroll-behavior:none}
body.big{--fs:18px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}

/* Thanh tiêu đề */
.top{background:var(--navy);color:#fff;padding:calc(var(--sat) + 8px) calc(var(--sar) + 12px) 10px calc(var(--sal) + 12px);display:flex;align-items:center;gap:8px;min-height:56px;flex:none}
.top h1{font-size:19px;margin:0;font-weight:700;flex:1;text-align:center;line-height:1.15}
.top h1 small{display:block;font-size:12.5px;font-weight:500;opacity:.8;margin-top:2px}
.ibtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.top .ibtn{background:rgba(255,255,255,.12)}
.top .ibtn.ghost{background:none}
.ibtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:14px calc(var(--sar) + 14px) calc(var(--sab) + 96px) calc(var(--sal) + 14px)}
.wrap{max-width:760px;margin:0 auto}

/* Thanh dưới */
.tabbar{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding:6px calc(var(--sar) + 8px) calc(var(--sab) + 6px) calc(var(--sal) + 8px);z-index:5}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--mut);min-width:84px;padding:4px}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8}
.tab.on{color:var(--blue);font-weight:600}
.fab{width:58px;height:58px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(22,24,27,.35);margin-top:-22px}
.fab svg{width:28px;height:28px;stroke:#fff;stroke-width:2.4;fill:none}

/* Thẻ, danh sách */
.card{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 1px 2px rgba(15,23,42,.06);margin-bottom:12px}
.seg{display:flex;background:#dde3e7;border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-weight:600;font-size:14.5px;color:#334155}
.seg button.on{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.sheetcard{display:block;width:100%;text-align:left}
.sheetcard .r1{display:flex;align-items:center;gap:8px}
.sheetcard .nm{font-weight:700;font-size:16.5px;flex:1}
.badge{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--blue-soft);color:var(--blue);white-space:nowrap}
.badge.sang{background:var(--ok-bg);color:var(--ok)}
.badge.lock{background:#eef2f7;color:#475569}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.red{background:var(--red-bg);color:var(--red)}
.sheetcard .r2{color:var(--mut);font-size:14px;margin-top:4px}
.sheetcard .r3{display:flex;gap:14px;margin-top:8px;align-items:baseline;flex-wrap:wrap}
.sheetcard .kg{font-size:22px;font-weight:800}
.sheetcard .kg small{font-size:13px;font-weight:600;color:var(--mut)}
.sheetcard .money{margin-left:auto;font-weight:700}
.empty{text-align:center;padding:30px 16px}
.empty .logo{width:76px;height:76px;border-radius:20px;margin:0 auto 12px;display:block}
.empty h2{margin:6px 0;font-size:20px}
.empty p{color:var(--mut);margin:6px 0}
.daysum{display:flex;gap:10px;margin-bottom:12px}
.daysum .card{flex:1;margin:0;padding:10px 12px}
.daysum b{display:block;font-size:20px}
.daysum span{font-size:12.5px;color:var(--mut)}
.search{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:12px}

/* Nút */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:13px 16px;border-radius:14px;font-weight:700;background:var(--blue);color:#fff;min-height:48px}
.btn.sec{background:var(--blue-soft);color:var(--blue)}
.btn.gray{background:#eef2f7;color:#1e293b}
.btn.red{background:var(--red-bg);color:var(--red)}
.btn.block{display:flex;width:100%}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px}
.row>*{flex:1}

/* ===== Màn hình cân ===== */
#weigh .stat{background:#fff;padding:8px 12px;display:flex;align-items:baseline;justify-content:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);flex:none}
#weigh .stat .tk{font-size:26px;font-weight:800}
#weigh .stat .u{font-size:13px;color:var(--mut)}
#weigh .stat .pc{background:var(--blue-soft);color:var(--blue);font-weight:700;border-radius:8px;padding:2px 8px}
#weigh .stat .np{color:var(--warn);font-size:13px;font-weight:600}
#weigh .stat .pr{color:var(--ok);font-size:14px;font-weight:700}
.wbody{flex:1;display:flex;min-height:0}
.gridwrap{flex:1;overflow:auto;padding:10px 10px 6px;-webkit-overflow-scrolling:touch;min-width:0}
.grid{display:flex;gap:8px;align-items:flex-start;width:max-content;padding-right:30px}
.col{width:66px;flex:none;display:flex;flex-direction:column;align-items:stretch}
.col .ch{text-align:center;font-weight:800;color:var(--blue);background:var(--blue-soft);border-radius:8px;padding:3px 0;margin-bottom:6px;font-size:14px}
.col .cells{background:#fff;border-radius:10px;padding:3px 0}
.cell{height:30px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;border-radius:7px;margin:0 4px;position:relative}
.cell.e{color:#cbd5e1;font-weight:400}
.cell.e::after{content:"·"}
.cell.sep{border-bottom:2px solid #94a3b8;border-radius:0}
.cell.last{background:var(--blue);color:#fff}
.cell.cur{border:2px solid var(--blue);background:#fff;color:var(--blue)}
.cell.cur.blink::before{content:"";position:absolute;right:8px;top:6px;bottom:6px;width:2px;background:var(--blue);animation:bl 1s steps(1) infinite}
.cell.cur.warn{border-color:#d97706;color:#b45309;background:var(--warn-bg)}
.cell.edited::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:#f59e0b}
@keyframes bl{50%{opacity:0}}
.col .ct{border-top:3px solid var(--navy);margin-top:6px;text-align:center;font-weight:800;padding-top:4px;font-size:15.5px}
.col .cum{text-align:center;font-size:12px;color:var(--mut);margin-top:2px}
.col .cum b{color:var(--navy);font-size:13.5px}

.hint{margin:0 10px 6px;border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;font-size:14.5px;flex:none}
.hint.info{background:var(--blue-soft);color:#24343d}
.hint.warn{background:var(--warn-bg);color:#7c2d12;border:1px solid #f5c26b}
.hint .tx{flex:1}
.hint .btn{padding:8px 12px;min-height:38px;font-size:14px}
.prompt{margin:0 10px 6px;background:#fff;border:2px solid #d97706;border-radius:14px;padding:12px;flex:none}
.prompt b{font-size:17px}
.prompt p{margin:4px 0 10px;color:var(--mut);font-size:14px}

.pad{flex:none;background:#fff;border-top:1px solid var(--line);padding:8px calc(var(--sar) + 8px) calc(var(--sab) + 8px) calc(var(--sal) + 8px)}
.keys{display:grid;grid-template-columns:repeat(3,1fr) 1.15fr;gap:8px;max-width:560px;margin:0 auto}
.k{height:58px;border-radius:14px;background:#e8ecef;border:1px solid #cdd6dc;font-size:26px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1.05;user-select:none;-webkit-user-select:none}
.k:active{background:#d3dde3;transform:scale(.97)}
.k.fn{font-size:13px;font-weight:600;color:#334155;background:#f6f8fc}
.k.fn small{font-size:11.5px;color:var(--blue);font-weight:700}
.k.fn.hot{background:#fff1d6;border-color:#f3c46b;color:#92400e}
.k.go{background:var(--navy);border-color:var(--navy);color:#fff;font-size:18px;font-weight:800}
.k.go small{font-size:12px;font-weight:600;opacity:.9}
.k.go:disabled{background:#a7b7c0;border-color:#a7b7c0}
.k:disabled{opacity:.4}
.k svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2}
.padmini{display:flex;justify-content:center;padding:8px calc(var(--sar) + 8px) calc(var(--sab) + 8px)}
.lockbar{background:#fff;border-top:1px solid var(--line);padding:12px calc(var(--sar) + 14px) calc(var(--sab) + 12px);display:flex;gap:10px;align-items:center;flex:none}
.lockbar .tx{flex:1;color:var(--mut);font-size:14px}

/* iPad / màn rộng: bảng bên trái, phím bên phải */
@media (min-width:900px){
  #weigh .wmain{flex-direction:row}
  #weigh .wleft{flex:1;display:flex;flex-direction:column;min-width:0}
  #weigh .pad{width:440px;border-top:0;border-left:1px solid var(--line);display:flex;flex-direction:column;justify-content:flex-end}
  .keys{grid-template-columns:repeat(3,1fr) 1.2fr}
  .k{height:76px;font-size:30px}
  .cell{height:36px;font-size:19px}
  .col{width:78px}
}
.wmain{flex:1;display:flex;flex-direction:column;min-height:0}
.wleft{flex:1;display:flex;flex-direction:column;min-height:0}

/* ===== Hộp thoại / bảng trượt ===== */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fi .15s}
.overlay.center{align-items:center;padding:20px}
@keyframes fi{from{opacity:0}}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:su .2s ease-out}
@keyframes su{from{transform:translateY(40px);opacity:.4}}
.sheet .sh{display:flex;align-items:center;gap:8px;padding:14px 16px 10px}
.sheet .sh h2{flex:1;margin:0;font-size:21px}
.sheet .sb{overflow:auto;padding:0 16px calc(var(--sab) + 18px);-webkit-overflow-scrolling:touch}
.sheet .x{background:#e6ebf4;border-radius:50%;width:36px;height:36px}
.dlg{background:#fff;border-radius:18px;max-width:420px;width:100%;padding:18px;animation:su .15s}
.dlg h3{margin:0 0 8px;font-size:19px}
.dlg p{margin:0 0 14px;color:#334155}
.dlg .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.dlg .acts .btn{min-width:96px}
.dlg input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:22px;font-weight:700;margin-bottom:14px;text-align:center}

/* Form */
.grp{font-size:12.5px;font-weight:700;color:var(--mut);letter-spacing:.04em;text-transform:uppercase;margin:18px 4px 8px}
.form{background:#fff;border-radius:16px;overflow:hidden}
.fr{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid #edf1f6;min-height:52px}
.fr:last-child{border-bottom:0}
.fr label{flex:none;width:42%;color:#1e293b}
.fr .v{flex:1;min-width:0;text-align:right}
.fr input,.fr select,.fr textarea{width:100%;border:0;background:transparent;text-align:right;outline:none;padding:4px 0;color:var(--blue);font-weight:600}
.fr input::placeholder{color:#94a3b8;font-weight:400}
.fr.col2{flex-direction:column;align-items:stretch}
.fr.col2 label{width:auto}
.fr textarea{text-align:left;min-height:60px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:8px;color:var(--ink);font-weight:400}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts button{flex:1;padding:10px 6px;border-radius:12px;background:#eef2f7;font-weight:600;font-size:14.5px;min-width:80px}
.opts button.on{background:var(--blue);color:#fff}
.opts button small{display:block;font-size:11.5px;font-weight:500;opacity:.85}
.note{font-size:13px;color:var(--mut);padding:6px 4px 0}
.sw{width:50px;height:30px;border-radius:99px;background:#cbd5e1;position:relative;flex:none;transition:.15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.15s}
.sw.on{background:var(--blue)}
.sw.on::after{left:23px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--blue-soft);color:var(--blue);border-radius:99px;padding:6px 10px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.chip button{color:#64748b;font-size:16px;line-height:1}
.listrow{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid #edf1f6}
.listrow:last-child{border-bottom:0}
.listrow .t{flex:1}
.listrow .t small{display:block;color:var(--mut)}
.pay{display:flex;gap:8px;align-items:center;padding:8px 14px;border-bottom:1px solid #edf1f6}
.pay input{border:1px solid var(--line);border-radius:10px;padding:8px;min-width:0}
.pay .amt{flex:1;text-align:right;font-weight:700}
.pay .dt{width:132px}
.loglist{font-size:13.5px;color:#334155}
.loglist div{padding:6px 0;border-bottom:1px dashed var(--line)}

/* Toast */
#toast{position:fixed;left:50%;top:calc(var(--sat) + 64px);transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 14px;border-radius:12px;z-index:80;display:flex;gap:12px;align-items:center;font-weight:600;font-size:14.5px;max-width:92%;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast button{color:#a9c7d6;font-weight:700}

/* ===== Phiếu ===== */
.rcpt{background:#fff;border-radius:14px;padding:16px;font-size:14.5px;color:#0f172a}
.rcpt h2{text-align:center;margin:0;font-size:20px;letter-spacing:.03em}
.rcpt .sub{text-align:center;color:#475569;margin:2px 0 10px}
.rcpt table{width:100%;border-collapse:collapse}
.rcpt .meta td{padding:3px 0}
.rcpt .meta td:last-child{text-align:right;font-weight:600}
.rcpt .bk{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin:10px 0}
.rcpt .bk .c{border:1px solid #cbd5e1;border-radius:8px;padding:4px;text-align:center;font-size:13.5px}
.rcpt .bk .c .h{font-weight:800;color:var(--blue);font-size:12px}
.rcpt .bk .c .t{border-top:2px solid #0f172a;font-weight:800;margin-top:2px}
.rcpt .sum td{padding:5px 0;border-bottom:1px dashed #cbd5e1}
.rcpt .sum td:last-child{text-align:right;font-weight:700}
.rcpt .sum tr.big td{font-size:18px;font-weight:800;border-bottom:2px solid #0f172a}
.rcpt .qr{display:flex;gap:12px;align-items:center;margin-top:12px;border:1px solid #cbd5e1;border-radius:12px;padding:10px}
.rcpt .qr img{width:130px;height:130px;image-rendering:pixelated}
.rcpt .sign{display:flex;justify-content:space-around;margin-top:16px;text-align:center;font-weight:600}
.rcpt .sign div{width:45%}
.rcpt .sign span{display:block;height:56px}
.rcpt .foot{text-align:center;color:#94a3b8;font-size:12px;margin-top:10px}
.shareacts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}

@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{position:absolute;left:0;top:0;width:100%}
  .rcpt{box-shadow:none;border:0;padding:0}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="printArea" class="hidden"></div>
<script src="qrcode.js"></script>
<script src="calc.js"></script>
<script src="app.js"></script>
</body>
</html>
